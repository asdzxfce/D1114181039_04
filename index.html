<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Space Shooter | 學號專案</title>
    <style>
        @import url('https://googleapis.com');

        body { 
            text-align: center; background: #000; color: #0f0; 
            font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; 
            image-rendering: pixelated; 
        }
        
        canvas { 
            background: #000; display: block; margin: 20px auto; 
            border: 4px solid #fff; max-width: 95vw; max-height: 70vh;
        }

        /* 介面樣式 */
        #ui, #game-over { position: absolute; width: 100%; pointer-events: none; }
        #ui { top: 30px; }
        #game-over { 
            top: 50%; transform: translateY(-50%); display: none; 
            background: rgba(0, 0, 0, 0.85); padding: 20px 0; pointer-events: auto;
        }

        .logo { border: 2px solid #fff; margin-bottom: 10px; }
        button { 
            font-family: 'Press Start 2P', cursive; background: #0f0; 
            color: #000; border: none; padding: 10px 20px; cursor: pointer; margin-top: 20px;
        }
        .leaderboard { font-size: 12px; color: #ff0; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="ui">
        <img src="shotgame.webp" alt="Logo" class="logo" width="60">
        <div style="font-size: 16px;">SCORE: <span id="score">000</span></div>
    </div>

    <!-- 結束畫面與排行榜 -->
    <div id="game-over">
        <h2 style="color: #f00;">GAME OVER</h2>
        <div id="final-score">FINAL SCORE: 0</div>
        <div class="leaderboard">
            <div>--- TOP 3 ---</div>
            <div id="high-scores"></div>
        </div>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('game-over');
        const highScoresEl = document.getElementById('high-scores');
        
        canvas.width = 320; 
        canvas.height = 480;

        let score = 0;
        let isGameOver = false;
        let player = { x: 140, y: 400, size: 32, speed: 5 };
        let bullets = [];
        let enemies = [];
        let keys = {};

        const playerImg = new Image();
        playerImg.src = 'shotgame.webp';

        // 監聽按鍵與點擊
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        canvas.addEventListener('mousedown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / (rect.right - rect.left) * canvas.width;
            player.x = x - player.size/2;
            fire();
        });

        function spawnEnemy() {
            if (!isGameOver) enemies.push({ x: Math.random() * (canvas.width - 24), y: -24, size: 24, speed: 2 + (score/200) });
        }
        let enemyTimer = setInterval(spawnEnemy, 1000);

        function fire() {
            bullets.push({ x: player.x + player.size / 2 - 2, y: player.y, w: 4, h: 8 });
        }

        function update() {
            if (isGameOver) return;

            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;
            if (keys['Space']) {
                if (bullets.length === 0 || bullets[bullets.length - 1].y < player.y - 40) fire();
            }

            bullets.forEach((b, bi) => {
                b.y -= 7;
                if (b.y < 0) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                en.y += en.speed;
                // 碰撞檢測
                if (en.x < player.x + 25 && en.x + en.size > player.x + 5 && en.y < player.y + 25 && en.y + en.size > player.y + 5) {
                    endGame();
                }
                // 擊中敵機
                bullets.forEach((b, bi) => {
                    if (b.x < en.x + en.size && b.x + b.w > en.x && b.y < en.y + en.size && b.y + b.h > en.y) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 10;
                        scoreEl.innerText = score.toString().padStart(3, '0');
                    }
                });
                if (en.y > canvas.height) enemies.splice(ei, 1);
            });
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 隨機星空
            ctx.fillStyle = '#fff';
            for(let i=0; i<8; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

            if (!isGameOver) {
                ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
                ctx.fillStyle = '#ff0';
                bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
                ctx.fillStyle = '#f0f';
                enemies.forEach(en => ctx.fillRect(en.x, en.y, en.size, en.size));
            }
        }

        function endGame() {
            isGameOver = true;
            gameOverEl.style.display = 'block';
            document.getElementById('final-score').innerText = "FINAL SCORE: " + score;
            saveHighScore(score);
            showLeaderboard();
        }

        function saveHighScore(newScore) {
            let scores = JSON.parse(localStorage.getItem('shooting_scores') || "[]");
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 3); // 只取前三名
            localStorage.setItem('shooting_scores', JSON.stringify(scores));
        }

        function showLeaderboard() {
            let scores = JSON.parse(localStorage.getItem('shooting_scores') || "[]");
            highScoresEl.innerHTML = scores.map((s, i) => `<div>#${i+1} - ${s}</div>`).join('');
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = "000";
            isGameOver = false;
            enemies = [];
            bullets = [];
            player.x = 140;
            gameOverEl.style.display = 'none';
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
