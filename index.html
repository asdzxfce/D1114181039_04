<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure Pro | 升級系統版</title>
    <style>
        @import url('https://googleapis.com');
        body { text-align: center; background: #000; color: #0f0; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; image-rendering: pixelated; }
        canvas { background: #000; display: block; margin: 0 auto; border: 4px solid #333; }
        #ui, #game-over, #upgrade-menu { position: absolute; width: 100%; pointer-events: none; z-index: 10; }
        #ui { top: 20px; }
        #game-over, #upgrade-menu { top: 50%; transform: translateY(-50%); display: none; background: rgba(0, 0, 0, 0.9); padding: 30px 0; pointer-events: auto; border-top: 4px solid #0f0; border-bottom: 4px solid #0f0; }
        #game-over { border-color: #f00; }
        .upgrade-btn { background: #222; color: #0f0; border: 2px solid #0f0; padding: 15px; margin: 10px; cursor: pointer; display: inline-block; width: 250px; font-family: 'Press Start 2P'; font-size: 10px; }
        .upgrade-btn:hover { background: #0f0; color: #000; }
        #xp-bar-container { width: 300px; height: 10px; border: 2px solid #fff; margin: 10px auto; }
        #xp-bar { width: 0%; height: 100%; background: #ff0; }
        .hint { font-size: 8px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <img src="space_adventure_logo_black_bg.png" alt="Logo" width="140"><br>
        <div style="font-size: 12px; color: #fff;">LVL: <span id="lvl">1</span> | SCORE: <span id="score">000</span></div>
        <div id="xp-bar-container"><div id="xp-bar"></div></div>
        <div class="hint">[WASD]移動 [ESC]結束</div>
    </div>

    <!-- 升級選單 -->
    <div id="upgrade-menu">
        <h2 style="color: #ff0;">LEVEL UP!</h2>
        <p style="font-size: 10px;">CHOOSE YOUR WEAPON</p>
        <div class="upgrade-btn" onclick="upgrade('spread')">散彈槍 (SPREAD)</div><br>
        <div class="upgrade-btn" onclick="upgrade('rapid')">高速雷射 (RAPID)</div><br>
        <div class="upgrade-btn" onclick="upgrade('heavy')">重型巨砲 (HEAVY)</div>
    </div>

    <div id="game-over">
        <h2 style="color: #f00;">MISSION FAILED</h2>
        <div id="final-score">SCORE: 0</div>
        <button onclick="location.reload()" style="font-family:'Press Start 2P'; padding:10px; margin-top:20px; cursor:pointer;">RESTART</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; canvas.height = 600;

        let score = 0, level = 1, xp = 0, xpNext = 50;
        let isGameOver = false, isPaused = false;
        let weaponType = 'normal'; // normal, spread, rapid, heavy
        
        let player = { x: 180, y: 500, size: 40, speed: 6 };
        let bullets = [], enemies = [], exps = [];
        let keys = {};

        const playerImg = new Image(); playerImg.src = 'shotgame.webp';
        const enemyImg = new Image(); enemyImg.src = 'space_shooter_logo_red.png';

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Escape') endGame();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawnEnemy() {
            if (!isGameOver && !isPaused) 
                enemies.push({ x: Math.random() * (canvas.width - 35), y: -50, size: 35, speed: 2 + (level*0.3) });
        }
        setInterval(spawnEnemy, 1000);

        function fire() {
            if (weaponType === 'normal') {
                bullets.push({ x: player.x + player.size/2 - 2, y: player.y, w: 4, h: 10, vx: 0, vy: -8, type: 'n' });
            } else if (weaponType === 'spread') {
                bullets.push({ x: player.x + player.size/2 - 2, y: player.y, w: 4, h: 10, vx: -2, vy: -7 });
                bullets.push({ x: player.x + player.size/2 - 2, y: player.y, w: 4, h: 10, vx: 0, vy: -8 });
                bullets.push({ x: player.x + player.size/2 - 2, y: player.y, w: 4, h: 10, vx: 2, vy: -7 });
            } else if (weaponType === 'rapid') {
                bullets.push({ x: player.x + player.size/2 - 2, y: player.y, w: 3, h: 8, vx: 0, vy: -12 });
            } else if (weaponType === 'heavy') {
                bullets.push({ x: player.x + player.size/2 - 10, y: player.y, w: 20, h: 20, vx: 0, vy: -5, type: 'h' });
            }
        }

        function upgrade(type) {
            weaponType = type;
            isPaused = false;
            document.getElementById('upgrade-menu').style.display = 'none';
        }

        function update() {
            if (isGameOver || isPaused) return;

            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.size) player.x += player.speed;
            if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 0) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.size) player.y += player.speed;

            // 射擊頻率控制
            let cooldown = weaponType === 'rapid' ? 100 : 400;
            if (!player.lastFire || Date.now() - player.lastFire > cooldown) {
                fire(); player.lastFire = Date.now();
            }

            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                if (b.y < -20) bullets.splice(i, 1);
            });

            enemies.forEach((en, ei) => {
                en.y += en.speed;
                if (en.y > 600) enemies.splice(ei, 1);
                
                // 玩家碰撞
                if (Math.abs(en.x - player.x) < 30 && Math.abs(en.y - player.y) < 30) endGame();

                // 子彈擊中
                bullets.forEach((b, bi) => {
                    if (b.x < en.x + en.size && b.x + b.w > en.x && b.y < en.y + en.size && b.y + b.h > en.y) {
                        exps.push({ x: en.x + en.size/2, y: en.y + en.size/2 });
                        enemies.splice(ei, 1);
                        if (b.type !== 'h') bullets.splice(bi, 1); // 重砲穿透
                        score += 10;
                        document.getElementById('score').innerText = score.toString().padStart(3, '0');
                    }
                });
            });

            // 經驗值收集
            exps.forEach((e, i) => {
                e.y += 2;
                if (Math.abs(e.x - (player.x + 20)) < 40 && Math.abs(e.y - (player.y + 20)) < 40) {
                    exps.splice(i, 1);
                    xp += 20;
                    if (xp >= xpNext) {
                        level++;
                        xp = 0; xpNext += 50;
                        isPaused = true;
                        document.getElementById('upgrade-menu').style.display = 'block';
                        document.getElementById('lvl').innerText = level;
                    }
                    document.getElementById('xp-bar').style.width = (xp / xpNext * 100) + '%';
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 400, 600);
            
            // 畫經驗值 (黃色方塊)
            ctx.fillStyle = '#ff0';
            exps.forEach(e => ctx.fillRect(e.x, e.y, 8, 8));

            // 畫玩家與敵人
            ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
            enemies.forEach(en => ctx.drawImage(enemyImg, en.x, en.y, en.size, en.size));

            // 畫子彈
            bullets.forEach(b => {
                ctx.fillStyle = weaponType === 'heavy' ? '#f00' : '#0ff';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "SCORE: " + score;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
