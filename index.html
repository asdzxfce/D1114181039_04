<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Space Shooter | 學號挑戰</title>
    <style>
        /* 8-bit 復古字體與配色 */
        @import url('https://googleapis.com');

        body { 
            text-align: center; 
            background: #000; 
            color: #0f0; 
            font-family: 'Press Start 2P', cursive; 
            margin: 0; 
            overflow: hidden; 
            image-rendering: pixelated; /* 讓圖片呈現像素感 */
        }
        
        #ui { 
            position: absolute; 
            top: 20px; 
            width: 100%; 
            pointer-events: none; 
            text-shadow: 2px 2px #f00;
        }

        canvas { 
            background: #000; 
            display: block; 
            margin: 0 auto; 
            border: 4px solid #fff;
            image-rendering: pixelated;
            max-width: 100vw;
            max-height: 80vh;
        }

        .logo { 
            margin-bottom: 10px; 
            border: 2px solid #fff; 
            background: #222;
            image-rendering: pixelated; /* 強制 Logo 像素化 */
        }

        .instruction { font-size: 10px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <img src="shotgame.webp" alt="Logo" class="logo" width="60">
        <div style="font-size: 18px;">SCORE: <span id="score">000</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    <p class="instruction">[←/→] 移動 | [SPACE] 射擊 | 或點擊畫面兩側操控</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 320; // 降低解析度以符合 8-bit 風格
        canvas.height = 480;

        let score = 0;
        let player = { x: 140, y: 400, size: 32, speed: 4 };
        let bullets = [];
        let enemies = [];
        let keys = {};

        const playerImg = new Image();
        playerImg.src = 'shotgame.webp';

        // 鍵盤監聽
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // 點擊/觸控監聽 (點左走左，點右走右)
        canvas.addEventListener('touchstart', handleInput);
        canvas.addEventListener('mousedown', handleInput);
        function handleInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = (clientX - rect.left) / (rect.right - rect.left) * canvas.width;
            if (x < canvas.width / 2) { player.x -= 15; } else { player.x += 15; }
            fire();
        }

        function spawnEnemy() {
            enemies.push({ x: Math.random() * (canvas.width - 20), y: -20, size: 20, speed: 1.5 + (score/100) });
        }
        setInterval(spawnEnemy, 1200);

        function fire() {
            bullets.push({ x: player.x + player.size / 2 - 2, y: player.y, w: 4, h: 8 });
        }

        function update() {
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;
            if (keys['Space']) {
                if (bullets.length === 0 || bullets[bullets.length - 1].y < player.y - 40) fire();
            }

            bullets.forEach((b, bi) => {
                b.y -= 6;
                if (b.y < 0) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                en.y += en.speed;
                // 碰撞檢測
                if (en.x < player.x + player.size - 5 && en.x + en.size > player.x + 5 && en.y < player.y + player.size - 5 && en.y + en.size > player.y + 5) {
                    alert("GAME OVER\nSCORE: " + score);
                    document.location.reload();
                }
                bullets.forEach((b, bi) => {
                    if (b.x < en.x + en.size && b.x + b.w > en.x && b.y < en.y + en.size && b.y + b.h > en.y) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 10;
                        document.getElementById('score').innerText = score.toString().padStart(3, '0');
                    }
                });
                if (en.y > canvas.height) enemies.splice(ei, 1);
            });
        }

        function draw() {
            // 背景黑白閃爍星空感
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 隨機畫一點像素星星
            ctx.fillStyle = '#fff';
            for(let i=0; i<5; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

            // 畫玩家 (你的 Logo)
            ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
            
            // 畫 8-bit 子彈
            ctx.fillStyle = '#ff0';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            
            // 畫 8-bit 敵人 (紫色方塊)
            ctx.fillStyle = '#f0f';
            enemies.forEach(en => ctx.fillRect(en.x, en.y, en.size, en.size));
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
