<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure | Final Balance</title>
    <style>
        @import url('https://googleapis.com');
        body { text-align: center; background: #000; color: #0f0; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; image-rendering: pixelated; }
        canvas { background: #000; display: block; margin: 0 auto; border: 4px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        #ui { position: absolute; top: 10px; width: 100%; pointer-events: none; z-index: 10; }
        #xp-container { width: 250px; height: 10px; border: 2px solid #fff; margin: 8px auto; background: #222; }
        #xp-bar { width: 0%; height: 100%; background: #ff0; transition: width 0.3s; }
        #upgrade-menu, #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; background: rgba(0, 0, 0, 0.95); border: 4px solid #0f0; padding: 20px; display: none; z-index: 100; pointer-events: auto; }
        #game-over { border-color: #f00; }
        .opt { background: #111; color: #0f0; border: 2px solid #0f0; padding: 12px; margin: 12px 0; cursor: pointer; font-size: 10px; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .opt:hover { background: #0f0; color: #000; }
        .hint { font-size: 8px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <img src="space_adventure_logo_black_bg.png" alt="Logo" width="130"><br>
        <div style="font-size: 10px; color: #fff; margin-top:5px;">LV: <span id="lvl">1</span> | SCORE: <span id="score">000</span></div>
        <div id="xp-container"><div id="xp-bar"></div></div>
        <div class="hint">[WASD/方向鍵]移動 [ESC]結算</div>
    </div>

    <div id="upgrade-menu">
        <h2 style="color:#ff0; font-size:14px; margin-bottom:20px;">SYSTEM UPGRADE</h2>
        <div class="opt" onclick="applyUpgrade('spread')">WPN: SPREAD (散彈)</div>
        <div class="opt" onclick="applyUpgrade('rapid')">WPN: RAPID (射速)</div>
        <div class="opt" onclick="applyUpgrade('heavy')">WPN: HEAVY (穿透)</div>
    </div>

    <div id="game-over">
        <h2 style="color:#f00; font-size:14px;">MISSION FAILED</h2>
        <p id="final-score" style="font-size:12px;">SCORE: 0</p>
        <button class="opt" onclick="location.reload()">RE-DEPLOY</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; canvas.height = 650;

        let score = 0, lvl = 1, xp = 0, xpNext = 100;
        let isGameOver = false, isPaused = false;
        let weapon = 'normal'; 
        
        // 調降初始速度 speed: 4
        let player = { x: 180, y: 550, size: 40, speed: 4 };
        let bullets = [], enemies = [], drops = [];
        let keys = {};

        const pImg = new Image(); pImg.src = 'shotgame.webp';
        const eImg = new Image(); eImg.src = 'space_shooter_logo_red.png';

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === 'Escape' && !isGameOver) endGame();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawn() {
            if(!isGameOver && !isPaused) 
                enemies.push({ x: Math.random()*360, y: -50, size: 35, speed: 1.5 + (lvl*0.2) });
        }
        setInterval(spawn, 1200);

        function applyUpgrade(type) {
            weapon = type;
            isPaused = false;
            document.getElementById('upgrade-menu').style.display = 'none';
        }

        function update() {
            if (isGameOver || isPaused) return;

            if ((keys.KeyA || keys.ArrowLeft) && player.x > 0) player.x -= player.speed;
            if ((keys.KeyD || keys.ArrowRight) && player.x < 360) player.x += player.speed;
            if ((keys.KeyW || keys.ArrowUp) && player.y > 0) player.y -= player.speed;
            if ((keys.KeyS || keys.ArrowDown) && player.y < 600) player.y += player.speed;

            let rate = (weapon === 'rapid') ? 120 : 400;
            if(!player.lastF || Date.now() - player.lastF > rate) {
                if(weapon === 'spread') {
                    bullets.push({x: player.x+18, y: player.y, vx: -2, vy: -7, w:4, h:10});
                    bullets.push({x: player.x+18, y: player.y, vx: 0, vy: -8, w:4, h:10});
                    bullets.push({x: player.x+18, y: player.y, vx: 2, vy: -7, w:4, h:10});
                } else if(weapon === 'heavy') {
                    bullets.push({x: player.x+10, y: player.y, vx: 0, vy: -5, w:20, h:20, p:true});
                } else {
                    bullets.push({x: player.x+18, y: player.y, vx: 0, vy: -8, w:4, h:10});
                }
                player.lastF = Date.now();
            }

            bullets.forEach((b, bi) => {
                b.x += b.vx || 0; b.y += b.vy;
                if (b.y < -20) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                en.y += en.speed;
                // 碰撞判定
                if(Math.abs(en.x - player.x) < 28 && Math.abs(en.y - player.y) < 28) endGame();

                bullets.forEach((b, bi) => {
                    if(b.x < en.x+en.size && b.x+b.w > en.x && b.y < en.y+en.size && b.y+b.h > en.y) {
                        drops.push({x: en.x+12, y: en.y+12});
                        enemies.splice(ei, 1);
                        if(!b.p) bullets.splice(bi, 1);
                        score += 10;
                        document.getElementById('score').innerText = score.toString().padStart(3, '0');
                    }
                });
                if(en.y > 700) enemies.splice(ei, 1);
            });

            drops.forEach((d, di) => {
                d.y += 1.8; // 稍微放慢經驗值掉落
                if(Math.abs(d.x - (player.x+15)) < 35 && Math.abs(d.y - (player.y+15)) < 35) {
                    drops.splice(di, 1);
                    xp += 40; 
                    if(xp >= xpNext) {
                        isPaused = true;
                        document.getElementById('upgrade-menu').style.display = 'block';
                        lvl++; xp = 0; xpNext += 60;
                        document.getElementById('lvl').innerText = lvl;
                    }
                    document.getElementById('xp-bar').style.width = Math.min(100, (xp/xpNext*100)) + '%';
                }
                if(d.y > 700) drops.splice(di, 1);
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ff0';
            drops.forEach(d => ctx.fillRect(d.x, d.y, 10, 10));
            ctx.fillStyle = (weapon==='heavy') ? '#f00' : '#0ff';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            ctx.drawImage(pImg, player.x, player.y, player.size, player.size);
            enemies.forEach(en => ctx.drawImage(eImg, en.x, en.y, en.size, en.size));
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "FINAL SCORE: " + score;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
