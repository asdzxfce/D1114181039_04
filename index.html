<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure | 學號專案</title>
    <style>
        @import url('https://googleapis.com');
        body { text-align: center; background: #000; color: #0f0; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; image-rendering: pixelated; }
        canvas { background: #000; display: block; margin: 0 auto; border: 4px solid #fff; cursor: crosshair; }
        #ui, #game-over { position: absolute; width: 100%; pointer-events: none; z-index: 10; }
        #ui { top: 20px; }
        #game-over { top: 50%; transform: translateY(-50%); display: none; background: rgba(0, 0, 0, 0.9); padding: 30px 0; pointer-events: auto; border-top: 4px solid #f00; border-bottom: 4px solid #f00; }
        button { font-family: 'Press Start 2P', cursive; background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; margin-top: 20px; }
        .leaderboard { font-size: 12px; color: #ff0; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="ui">
        <!-- 標題圖片 -->
        <img src="space_adventure_logo_black_bg.png" alt="Logo" width="120"><br>
        <div style="font-size: 14px; margin-top:10px;">SCORE: <span id="score">000</span></div>
    </div>

    <div id="game-over">
        <h2 style="color: #f00;">MISSION FAILED</h2>
        <div id="final-score">SCORE: 0</div>
        <div class="leaderboard">
            <div>-- HIGH SCORES --</div>
            <div id="high-scores"></div>
        </div>
        <button onclick="resetGame()">RETRY</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; canvas.height = 600;

        let score = 0;
        let isGameOver = false;
        let player = { x: 180, y: 500, size: 40, speed: 5 };
        let bullets = [];
        let enemies = [];
        let keys = {};
        let mouse = { x: 180, y: 500 };

        // 載入圖片
        const playerImg = new Image(); playerImg.src = 'shotgame.webp'; // 玩家繼續使用原本的 Logo
        const enemyImg = new Image(); enemyImg.src = 'space_shooter_logo_red.png';

        // 監聽控制
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Escape') endGame(); // Esc 結束遊戲
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - rect.left) / (rect.right - rect.left) * canvas.width;
            mouse.y = (e.clientY - rect.top) / (rect.bottom - rect.top) * canvas.height;
        });

        function spawnEnemy() {
            if (!isGameOver) enemies.push({ x: Math.random() * (canvas.width - 35), y: -40, size: 35, speed: 2 + (score/150) });
        }
        setInterval(spawnEnemy, 800);

        function update() {
            if (isGameOver) return;

            // 鍵盤前後左右移動
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.size) player.x += player.speed;
            if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 0) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.size) player.y += player.speed;

            // 滑鼠追隨 (平滑移動)
            player.x += (mouse.x - (player.x + player.size/2)) * 0.1;
            player.y += (mouse.y - (player.y + player.size/2)) * 0.1;

            // 自動射擊或按空白鍵
            if (keys['Space'] || true) { 
                if (bullets.length === 0 || bullets[bullets.length - 1].y < player.y - 30) {
                    bullets.push({ x: player.x + player.size / 2 - 2, y: player.y, w: 4, h: 10 });
                }
            }

            bullets.forEach((b, bi) => {
                b.y -= 8;
                if (b.y < 0) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                en.y += en.speed;
                // 碰撞偵測 (與敵人相撞)
                if (en.x < player.x + player.size - 10 && en.x + en.size > player.x + 10 && 
                    en.y < player.y + player.size - 10 && en.y + en.size > player.y + 10) {
                    endGame();
                }
                // 子彈擊中敵人
                bullets.forEach((b, bi) => {
                    if (b.x < en.x + en.size && b.x + b.w > en.x && b.y < en.y + en.size && b.y + b.h > en.y) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 10;
                        document.getElementById('score').innerText = score.toString().padStart(3, '0');
                    }
                });
                if (en.y > canvas.height) enemies.splice(ei, 1);
            });
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 星空背景
            ctx.fillStyle = '#555';
            for(let i=0; i<15; i++) ctx.fillRect(Math.random()*canvas.width, (Date.now()/10 + i*50)%canvas.height, 2, 2);

            if (!isGameOver) {
                ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
                ctx.fillStyle = '#ff0';
                bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
                enemies.forEach(en => ctx.drawImage(enemyImg, en.x, en.y, en.size, en.size));
            }
        }

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "SCORE: " + score;
            saveScore(score);
            showLeaderboard();
        }

        function saveScore(s) {
            let scores = JSON.parse(localStorage.getItem('space_scores') || "[]");
            scores.push(s);
            scores.sort((a, b) => b - a);
            localStorage.setItem('space_scores', JSON.stringify(scores.slice(0, 5)));
        }

        function showLeaderboard() {
            let scores = JSON.parse(localStorage.getItem('space_scores') || "[]");
            document.getElementById('high-scores').innerHTML = scores.map((s, i) => `<div>#${i+1} - ${s}</div>`).join('');
        }

        function resetGame() {
            score = 0; document.getElementById('score').innerText = "000";
            isGameOver = false; enemies = []; bullets = [];
            player.x = 180; player.y = 500;
            document.getElementById('game-over').style.display = 'none';
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
