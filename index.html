<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure | Level Up System</title>
    <style>
        @import url('https://googleapis.com');
        body { text-align: center; background: #000; color: #0f0; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; image-rendering: pixelated; }
        canvas { background: #000; display: block; margin: 0 auto; border: 4px solid #333; }
        
        /* UI 容器 */
        #ui { position: absolute; top: 10px; width: 100%; pointer-events: none; z-index: 10; }
        #xp-container { width: 200px; height: 12px; border: 2px solid #fff; margin: 5px auto; background: #222; }
        #xp-bar { width: 0%; height: 100%; background: #ff0; transition: width 0.2s; }
        
        /* 升級選單與結束畫面 */
        #upgrade-menu, #game-over { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; background: rgba(0, 0, 0, 0.95); border: 4px solid #0f0;
            padding: 20px; display: none; z-index: 100; pointer-events: auto;
        }
        #game-over { border-color: #f00; }
        
        .opt { background: #222; color: #0f0; border: 2px solid #0f0; padding: 10px; margin: 10px 0; cursor: pointer; font-size: 10px; }
        .opt:hover { background: #0f0; color: #000; }
        .hint { font-size: 8px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <img src="space_adventure_logo_black_bg.png" alt="Logo" width="120"><br>
        <div style="font-size: 10px;">SCORE: <span id="score">000</span> | LV: <span id="lvl">1</span></div>
        <div id="xp-container"><div id="xp-bar"></div></div>
        <div class="hint">[WASD]控制 | [ESC]結束</div>
    </div>

    <!-- 升級選單 -->
    <div id="upgrade-menu">
        <h2 style="color:#ff0; font-size:16px;">LEVEL UP!</h2>
        <div class="opt" onclick="applyUpgrade('spread')">SPREAD (三向散彈)</div>
        <div class="opt" onclick="applyUpgrade('rapid')">RAPID (高速雷射)</div>
        <div class="opt" onclick="applyUpgrade('heavy')">HEAVY (重型穿透)</div>
    </div>

    <!-- 結束畫面 -->
    <div id="game-over">
        <h2 style="color:#f00; font-size:16px;">TERMINATED</h2>
        <p id="final-score">SCORE: 0</p>
        <button class="opt" onclick="location.reload()">RETRY</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; canvas.height = 600;

        let score = 0, lvl = 1, xp = 0, xpNext = 100;
        let isGameOver = false, isPaused = false;
        let weapon = 'normal'; // normal, spread, rapid, heavy
        
        let player = { x: 180, y: 500, size: 40, speed: 6 };
        let bullets = [], enemies = [], drops = [];
        let keys = {};

        const pImg = new Image(); pImg.src = 'shotgame.webp';
        const eImg = new Image(); eImg.src = 'space_shooter_logo_red.png';

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === 'Escape') endGame();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawn() {
            if(!isGameOver && !isPaused) 
                enemies.push({ x: Math.random()*360, y: -40, size: 35, hp: 1, speed: 2 + (lvl*0.2) });
        }
        setInterval(spawn, 1000);

        function applyUpgrade(type) {
            weapon = type;
            isPaused = false;
            document.getElementById('upgrade-menu').style.display = 'none';
        }

        function update() {
            if (isGameOver || isPaused) return;

            // 移動
            if ((keys.KeyA || keys.ArrowLeft) && player.x > 0) player.x -= player.speed;
            if ((keys.KeyD || keys.ArrowRight) && player.x < 360) player.x += player.speed;
            if ((keys.KeyW || keys.ArrowUp) && player.y > 0) player.y -= player.speed;
            if ((keys.KeyS || keys.ArrowDown) && player.y < 560) player.y += player.speed;

            // 自動射擊
            let rate = (weapon === 'rapid') ? 150 : 400;
            if(!player.lastF || Date.now() - player.lastF > rate) {
                if(weapon === 'spread') {
                    bullets.push({x: player.x+18, y: player.y, vx: -2, vy: -7, w:4, h:10});
                    bullets.push({x: player.x+18, y: player.y, vx: 0, vy: -8, w:4, h:10});
                    bullets.push({x: player.x+18, y: player.y, vx: 2, vy: -7, w:4, h:10});
                } else if(weapon === 'heavy') {
                    bullets.push({x: player.x+10, y: player.y, vx: 0, vy: -5, w:20, h:20, p:true});
                } else {
                    bullets.push({x: player.x+18, y: player.y, vx: 0, vy: -8, w:4, h:10});
                }
                player.lastF = Date.now();
            }

            // 子彈與敵人碰撞
            bullets.forEach((b, bi) => {
                b.x += b.vx || 0; b.y += b.vy;
                enemies.forEach((en, ei) => {
                    if(b.x < en.x+en.size && b.x+b.w > en.x && b.y < en.y+en.size && b.y+b.h > en.y) {
                        drops.push({x: en.x+15, y: en.y+15}); // 必掉經驗值
                        enemies.splice(ei, 1);
                        if(!b.p) bullets.splice(bi, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                });
            });

            // 經驗值收集
            drops.forEach((d, di) => {
                d.y += 2;
                if(Math.abs(d.x - player.x) < 40 && Math.abs(d.y - player.y) < 40) {
                    drops.splice(di, 1);
                    xp += 35;
                    if(xp >= xpNext) {
                        isPaused = true;
                        document.getElementById('upgrade-menu').style.display = 'block';
                        lvl++; xp = 0; xpNext += 50;
                        document.getElementById('lvl').innerText = lvl;
                    }
                    document.getElementById('xp-bar').style.width = (xp/xpNext*100)+'%';
                }
                if(d.y > 600) drops.splice(di, 1);
            });

            enemies.forEach(en => {
                en.y += en.speed;
                if(Math.abs(en.x - player.x) < 30 && Math.abs(en.y - player.y) < 30) endGame();
            });
        }

        function draw() {
            ctx.clearRect(0,0,400,600);
            // 畫經驗值
            ctx.fillStyle = '#ff0';
            drops.forEach(d => ctx.fillRect(d.x, d.y, 10, 10));
            // 畫子彈
            ctx.fillStyle = (weapon==='heavy') ? '#f00' : '#0ff';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            // 畫人機
            ctx.drawImage(pImg, player.x, player.y, player.size, player.size);
            enemies.forEach(en => ctx.drawImage(eImg, en.x, en.y, en.size, en.size));
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "SCORE: " + score;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
